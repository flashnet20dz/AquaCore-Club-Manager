<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>AquaCore Club Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0d5952 0%, #034f77 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      position: relative;
    }
    .logo-container {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(45, 212, 191, 0.25), rgba(56, 189, 248, 0.15));
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(13, 148, 136, 0.3);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .logo-container svg {
      width: 52px;
      height: 52px;
      fill: #2dd4bf;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 50px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2.5px solid rgba(255, 255, 255, 0.25);
      border-top-color: #2dd4bf;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0d9488 0%, #0284c7 100%);
      color: white;
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.98);
      filter: brightness(1.1);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.2);
    }
    .server-url-tag {
      font-family: monospace;
      direction: ltr;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 14px;
      word-break: break-all;
    }
    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: right;
    }
    .input-label {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
      display: block;
    }
    .text-input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
      font-size: 13px;
      font-family: monospace;
      direction: ltr;
      margin-bottom: 16px;
      outline: none;
    }
    .text-input:focus { border-color: #14b8a6; }
    .preset-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .preset-btn {
      flex: 1;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .preset-btn.active {
      background: rgba(20, 184, 166, 0.2);
      border-color: #14b8a6;
      color: #2dd4bf;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container" style="overflow: hidden; padding: 4px; background: transparent; border: none; box-shadow: none;">
      <img src="logo.png" style="width: 100%; height: 100%; object-fit: contain; border-radius: 20px;" alt="AquaCore Club Manager">
    </div>

    <h1>AquaCore Club Manager</h1>
    <p class="subtitle">منظومة إدارة الاشتراكات والسباحة</p>

    <div class="status-badge" id="statusBadge">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">جاري الاتصال بالنظام...</span>
    </div>

    <button class="btn btn-primary" id="retryBtn" style="display:none;" onclick="loadApp()">
      إعادة المحاولة
    </button>

    <button class="btn btn-secondary" onclick="openSettings()">
      ⚙️ إعدادات السيرفر والربط
    </button>

    <div class="server-url-tag" id="currentUrlText">...</div>
  </div>

  <!-- Server Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px; font-size: 16px;">إعدادات خادم الاتصال</h3>
      
      <div class="preset-btns">
        <button type="button" class="preset-btn" onclick="selectPreset('cloud')">🌐 السيرفر السحابي</button>
        <button type="button" class="preset-btn" onclick="selectPreset('local')">🏠 سيرفر الكمبيوتر (WiFi)</button>
      </div>

      <label class="input-label">عنوان السيرفر (Server URL)</label>
      <input type="text" id="serverInput" class="text-input" placeholder="https://aladine-pool-manager.vercel.app">

      <button type="button" class="btn btn-primary" onclick="saveSettings()">
        حفظ والاتصال الآن
      </button>

      <button type="button" class="btn btn-secondary" onclick="closeSettings()">
        إلغاء
      </button>
    </div>
  </div>

  <script>
    const DEFAULT_CLOUD_URL = "https://aladine-pool-manager.vercel.app";
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('spinner');
    const retryBtn = document.getElementById('retryBtn');
    const currentUrlText = document.getElementById('currentUrlText');
    const serverInput = document.getElementById('serverInput');
    const settingsModal = document.getElementById('settingsModal');

    function getActiveServerUrl() {
      return localStorage.getItem('aquacore_server_url') || DEFAULT_CLOUD_URL;
    }

    async function loadApp() {
      const targetUrl = getActiveServerUrl();
      currentUrlText.textContent = targetUrl;
      statusText.textContent = 'جاري الاتصال...';
      spinner.style.display = 'block';
      retryBtn.style.display = 'none';

      try {
        // فحص سريع للاتصال مع مهلة 3 ثوانٍ
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3500);

        await fetch(targetUrl, {
          method: 'HEAD',
          mode: 'no-cors',
          cache: 'no-cache',
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        statusText.textContent = 'تم الاتصال — جاري الفتح...';
        setTimeout(() => {
          window.location.replace(targetUrl);
        }, 300);
      } catch (err) {
        statusText.textContent = 'تعذر الاتصال بالخادم المحدد';
        spinner.style.display = 'none';
        retryBtn.style.display = 'flex';
      }
    }

    function openSettings() {
      serverInput.value = getActiveServerUrl();
      settingsModal.classList.add('active');
    }

    function closeSettings() {
      settingsModal.classList.remove('active');
    }

    function selectPreset(type) {
      if (type === 'cloud') {
        serverInput.value = DEFAULT_CLOUD_URL;
      } else {
        serverInput.value = "http://192.168.1.15:3000";
      }
    }

    function saveSettings() {
      let val = serverInput.value.trim();
      if (!val) val = DEFAULT_CLOUD_URL;
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        val = 'http://' + val;
      }
      localStorage.setItem('aquacore_server_url', val);
      closeSettings();
      loadApp();
    }

    // بدء المحاولة فوراً
    loadApp();

    // إعادة المحاولة التلقائية عند عودة الاتصال
    window.addEventListener('online', loadApp);
  </script>
</body>
</html>
