<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>AquaCore Club Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f766e 0%, #0369a1 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      color: white;
      overflow: hidden;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    .logo svg {
      width: 70px;
      height: 70px;
      fill: white;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      opacity: 0.7;
    }
    .retry {
      margin-top: 24px;
      padding: 12px 24px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .retry:active { background: rgba(255,255,255,0.25); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
      </svg>
    </div>
    <div class="spinner" id="spinner"></div>
    <h1>AquaCore Club Manager</h1>
    <p id="status">جاري التحميل...</p>
    <button class="retry" id="retry" onclick="loadApp()">إعادة المحاولة</button>
  </div>

  <script>
    const LIVE_URL = "https://aladine-pool-manager.vercel.app";
    const status = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const retry = document.getElementById('retry');

    async function loadApp() {
      status.textContent = 'جاري التحميل...';
      spinner.style.display = 'block';
      retry.style.display = 'none';

      try {
        // تحقق من الاتصال
        const response = await fetch(LIVE_URL, { method: 'HEAD', mode: 'no-cors', cache: 'no-cache' });

        // إذا وصل → اredirect للموقع
        status.textContent = 'تم الاتصال — جاري الفتح...';
        window.location.replace(LIVE_URL);
      } catch (e) {
        // offline → اعرض رسالة
        status.textContent = 'لا يوجد اتصال بالإنترنت';
        spinner.style.display = 'none';
        retry.style.display = 'block';
      }
    }

    // ابدأ التحميل فوراً
    loadApp();

    // أعد المحاولة عند عودة الاتصال
    window.addEventListener('online', loadApp);
  </script>
</body>
</html>
