name: Build Android (APK & Google Play Bundle)

on:
  push:
    branches: [ main ]
    paths:
      - 'capacitor.config.ts'
      - '.github/workflows/build-android.yml'
      - 'android/**'
      - 'android-resources/**'
      - 'www/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and AAB Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Install Dependencies
        run: |
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/app@^6.0.0 @capacitor/splash-screen@^6.0.0 @capacitor/camera@^6.0.0 @capacitor/preferences@^6.0.0 --legacy-peer-deps

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Copy App Icons & Splash
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -d "android-resources/mipmap-$density" ]; then
              mkdir -p android/app/src/main/res/mipmap-$density
              cp -r android-resources/mipmap-$density/* android/app/src/main/res/mipmap-$density/ 2>/dev/null || true
            fi
          done

          if [ -f "android-resources/splash.png" ]; then
            mkdir -p android/app/src/main/res/drawable
            cp android-resources/splash.png android/app/src/main/res/drawable/splash.png
          fi

          echo "✅ Icons & Splash configured"

      - name: Build Signed Release APK & Google Play Bundle (AAB)
        run: |
          cd android
          chmod +x gradlew
          echo "Building Release APK..."
          ./gradlew assembleRelease --no-daemon -x lint -x lintVitalRelease
          echo "Building Google Play Release Bundle (.aab)..."
          ./gradlew bundleRelease --no-daemon -x lint -x lintVitalRelease

      - name: Prepare Output Artifacts
        run: |
          mkdir -p output

          # 1. APK (Direct Install)
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output/AquaCore-Club-Manager.apk
            echo "✅ Found APK at $APK_PATH"
          else
            echo "❌ APK not found at $APK_PATH"
          fi

          # 2. AAB (Google Play Store Bundle)
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            cp "$AAB_PATH" output/AquaCore-Club-Manager.aab
            echo "✅ Found AAB at $AAB_PATH"
          else
            echo "❌ AAB not found at $AAB_PATH"
          fi

          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AquaCore-Android-Packages
          path: output/*
          retention-days: 90
          compression-level: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AquaCore Club Manager v1.0.${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            output/AquaCore-Club-Manager.apk
            output/AquaCore-Club-Manager.aab
          body: |
            # 📱 AquaCore Club Manager — Android Release

            ## 📥 ملفات التحميل المباشر
            - **[AquaCore-Club-Manager.apk](https://github.com/flashnet20dz/AquaCore-Club-Manager/releases/download/v1.0.${{ github.run_number }}/AquaCore-Club-Manager.apk)**: لتثبيت التطبيق مباشرة على الهاتف بصيغة APK.
            - **[AquaCore-Club-Manager.aab](https://github.com/flashnet20dz/AquaCore-Club-Manager/releases/download/v1.0.${{ github.run_number }}/AquaCore-Club-Manager.aab)**: الحزمة الرسمية الموقعة الجاهزة للرفع على **Google Play Console** بصيغة App Bundle.

            ## 🌟 أبرز ميزات تطبيق الهاتف
            - ✅ شريط تنقل سفلي حديث واحترافي للهواتف (Bottom Navigation Bar)
            - ✅ كاميرا الحضور السريع بـ QR Code ومسح بطاقات المنخرطين
            - ✅ ربط تلقائي بنفس قاعدة البيانات (سحابياً عبر الإنترنت أو محلياً عبر شبكة الواي فاي LAN)
            - ✅ تفعيل التراخيص والاشتراكات أوفلاين بدون الحاجة للإنترنت
            - ✅ تطبيق سريع وخفيف متوافق 100% مع معايير Google Play (Target SDK 34)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 📱 AquaCore Android Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK:** output/AquaCore-Club-Manager.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **Google Play Bundle:** output/AquaCore-Club-Manager.aab" >> $GITHUB_STEP_SUMMARY
          echo "- **Target SDK:** 34 (Google Play Ready)" >> $GITHUB_STEP_SUMMARY
